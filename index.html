<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سالم أبو ريالة | Eng. AbuHatem - Portfolio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: rgba(18, 22, 31, 0.75);
            --text-main: #f0f2f5;
            --text-muted: #a0a6b0;
            --accent-red: #ff4757;
            --accent-orange: #ff7f50;
            --accent-green: #00ff87;
            --border-color: rgba(0, 255, 135, 0.15);
            --glow-shadow: 0 0 30px rgba(0, 255, 135, 0.3);
            
            --font-title: 'Cairo', sans-serif;
            --font-body: 'Tajawal', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            padding-bottom: 60px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Canvas */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.18;
            pointer-events: none;
        }

        .blob-1, .blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 { top: 5%; right: 10%; background: var(--accent-green); }
        .blob-2 { top: 45%; left: 10%; background: var(--accent-orange); }

        header {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(8, 9, 12, 0.85);
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(0,255,135,0.4);
        }

        nav a {
            font-family: var(--font-title);
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            margin-right: 20px;
            transition: all 0.3s;
            font-size: 1rem;
        }

        nav a:hover {
            color: var(--accent-green);
            text-shadow: 0 0 8px var(--accent-green);
        }

        .hero {
            padding: 110px 8% 60px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Avatar Container */
        .avatar-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 0 auto 30px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-orange), var(--accent-red));
            box-shadow: 0 0 35px rgba(0, 255, 135, 0.4);
            animation: pulse-glow 4s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 25px rgba(0, 255, 135, 0.3); transform: scale(1); }
            100% { box-shadow: 0 0 50px rgba(0, 255, 135, 0.6); transform: scale(1.02); }
        }

        .avatar-container-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background-color: #0c1017;
            position: relative;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.4s ease;
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.08);
        }

            font-family: var(--font-title);
            font-size: 3rem;
